# ─────────────────────────────────────────────
#  NexusHub — Application Configuration
# ─────────────────────────────────────────────

spring.application.name=nexushub-backend
server.port=8080

# ── H2 Dev Database ─────────────────────────
spring.datasource.url=jdbc:h2:mem:nexushubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ─────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── MySQL (uncomment to switch to production) ─
# spring.datasource.url=jdbc:mysql://localhost:3306/nexushubdb?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ── OpenAPI / Swagger ────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────
logging.level.com.nexushub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
